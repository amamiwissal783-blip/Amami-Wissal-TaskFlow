<div
  class="min-h-screen p-6"
  [class.bg-gray-100]="
    themeService.theme() === 'light'
  "
  [class.bg-slate-950]="
    themeService.theme() === 'dark'
  "
  [class.text-gray-900]="
    themeService.theme() === 'light'
  "
  [class.text-white]="
    themeService.theme() === 'dark'
  "
>

  <app-header />
  <app-notification />

  <app-view-toggle
    [activeView]="currentView()"
    (viewChange)="changeView($event)"
  />

  <div class="flex gap-6 mt-6">

    <main class="flex-1">

      @if (
        currentView() === 'tasks'
      ) {

        <app-project-list />

      } @else {

        <app-user-list />

      }

    </main>

    <app-recent-projects-sidebar />

  </div>

</div>
