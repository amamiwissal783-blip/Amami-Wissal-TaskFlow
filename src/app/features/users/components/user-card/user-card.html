<div class="border rounded-xl p-5 shadow-sm bg-white mb-5">

  <!-- Informations utilisateur -->
  <div class="flex justify-between items-start mb-5">

    <div>

      <h2 class="text-xl font-bold">
        {{ user().name }}
      </h2>

      <p class="text-gray-500">
        {{ user().email }}
      </p>

      <p class="text-sm mt-1">
        {{ user().role }}
      </p>

    </div>


    <!-- Badge actif / inactif -->

    @if (user().active) {

      <span
        class="px-3 py-1 rounded-full bg-green-100 text-green-700"
      >
        Actif
      </span>

    } @else {

      <span
        class="px-3 py-1 rounded-full bg-red-100 text-red-700"
      >
        Inactif
      </span>

    }

  </div>


  <!-- Compteurs -->

  <div class="grid grid-cols-3 gap-3 mb-6">

    <div class="bg-gray-100 p-3 rounded-lg text-center">

      <p class="text-xl font-bold">
        {{ pendingCount() }}
      </p>

      <p class="text-sm">
        À faire
      </p>

    </div>


    <div class="bg-gray-100 p-3 rounded-lg text-center">

      <p class="text-xl font-bold">
        {{ inProgressCount() }}
      </p>

      <p class="text-sm">
        En cours
      </p>

    </div>


    <div class="bg-gray-100 p-3 rounded-lg text-center">

      <p class="text-xl font-bold">
        {{ completedCount() }}
      </p>

      <p class="text-sm">
        Terminées
      </p>

    </div>

  </div>


  <!-- Tâches regroupées par projet -->

  @for (group of projectsWithTasks(); track group.project.id) {

    <app-user-project-group
      [project]="group.project"
      [tasks]="group.tasks"
    />

  } @empty {

    <app-empty-state
      message="Aucune tâche assignée"
    />

  }

</div>
