<!-- Recherche -->

<div class="mb-6">

  <input

    type="text"

    [ngModel]="
      searchTerm()
    "

    (ngModelChange)="
      searchTerm.set(
        $event
      )
    "

    placeholder="
      Rechercher un projet...
    "

    class="
      border
      rounded-lg
      px-4 py-2
      w-full
    "
  />

</div>


<!-- Projets -->

<div class="grid gap-6">

  @for (

    project of
      filteredProjects();

    track project.id

  ) {


    <app-project-card

      [project]="project"


      [users]="
        users()
      "


      [completedTasks]="
        completedTasksByProject()
        [project.id]
        ?? 0
      "


      (projectSelected)="
        onProjectSelected(
          $event
        )
      "


      (taskStatusChange)="
        onTaskStatusChange(
          $event
        )
      "


      (taskDelete)="
        onTaskDelete(
          $event
        )
      "

    />


  } @empty {


    <div
      class="
        rounded-lg
        border
        border-dashed
        p-6
        text-center
        text-gray-500
      "

      role="status"
    >

      Aucun projet trouvé

    </div>


  }

</div>
