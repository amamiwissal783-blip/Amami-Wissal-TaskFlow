<div class="bg-white rounded-xl shadow-md p-6">

  <h2 class="text-xl font-bold mb-2">
    {{ project().name }}
  </h2>

  <p class="text-gray-600 mb-3">
    {{ project().description }}
  </p>

  <p class="mb-4">
    <span class="font-semibold">Statut :</span>

    @if (project().status === 'En cours') {
      <span class="ml-2 px-2 py-1 rounded bg-blue-100 text-blue-700">
        {{ project().status }}
      </span>
    }

    @if (project().status === 'En attente') {
      <span class="ml-2 px-2 py-1 rounded bg-yellow-100 text-yellow-700">
        {{ project().status }}
      </span>
    }

    @if (project().status === 'Terminé') {
      <span class="ml-2 px-2 py-1 rounded bg-green-100 text-green-700">
        {{ project().status }}
      </span>
    }

  </p>

  <app-task-list
    [tasks]="project().tasks">
  </app-task-list>

  <button
    (click)="selectProject()"
    class="mt-4 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-700">
    Sélectionner
  </button>

</div>
