<header
  class="
    flex
    items-center
    justify-between
    px-6
    py-4
    bg-slate-900
    text-white
    rounded-lg
    mb-6
  "
>

  <h1 class="text-xl font-bold">
    TaskFlow
  </h1>

  <div class="flex items-center gap-4">

    <span>
      Favoris
      ({{ favoritesService.count() }})
    </span>

    <button
      type="button"
      class="
        px-3
        py-2
        rounded-lg
        bg-slate-700
        hover:bg-slate-600
      "
      (click)="
        themeService.toggleTheme()
      "
    >

      @if (
        themeService.theme() === 'light'
      ) {

        🌙 Mode sombre

      } @else {

        ☀️ Mode clair

      }

    </button>

  </div>

</header>
