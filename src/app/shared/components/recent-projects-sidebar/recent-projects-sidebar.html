<aside
  class="
    w-72
    bg-white
    border
    rounded-xl
    p-4
    shadow-sm
  "
>

  <h2
    class="
      text-lg
      font-bold
      mb-4
    "
  >
    Projets récents
  </h2>

  @for (
    project of
      recentProjectsService.recentProjects();
    track project.id
  ) {

    <div
      class="
        border-b
        py-3
        last:border-b-0
      "
    >

      <p
        class="
          font-semibold
          text-gray-800
        "
      >
        {{ project.name }}
      </p>

      <p
        class="
          text-sm
          text-gray-500
        "
      >
        {{ project.status }}
      </p>

    </div>

  } @empty {

    <p
      class="
        text-sm
        text-gray-500
      "
    >
      Aucun projet consulté
    </p>

  }

</aside>
