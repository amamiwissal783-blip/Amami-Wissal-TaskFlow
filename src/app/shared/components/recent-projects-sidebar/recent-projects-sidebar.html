<aside
  class="
    w-72
    border
    rounded-xl
    p-4
    shadow-sm
  "

  [class.bg-white]="
    themeService.theme() === 'light'
  "

  [class.bg-slate-800]="
    themeService.theme() === 'dark'
  "

  [class.text-gray-900]="
    themeService.theme() === 'light'
  "

  [class.text-white]="
    themeService.theme() === 'dark'
  "

  [class.border-gray-200]="
    themeService.theme() === 'light'
  "

  [class.border-slate-700]="
    themeService.theme() === 'dark'
  "
>

  <h2
    class="
      text-lg
      font-bold
      mb-4
    "
  >
    Projets récents
  </h2>

  @for (
    project of
      recentProjectsService.recentProjects();
    track project.id
  ) {

    <div
      class="
        py-3
        border-b
        last:border-b-0
      "

      [class.border-gray-200]="
        themeService.theme() === 'light'
      "

      [class.border-slate-600]="
        themeService.theme() === 'dark'
      "
    >

      <p class="font-semibold">
        {{ project.name }}
      </p>

      <p
        class="text-sm"

        [class.text-gray-500]="
          themeService.theme() === 'light'
        "

        [class.text-gray-300]="
          themeService.theme() === 'dark'
        "
      >
        {{ project.status }}
      </p>

    </div>

  } @empty {

    <p
      class="text-sm"

      [class.text-gray-500]="
        themeService.theme() === 'light'
      "

      [class.text-gray-300]="
        themeService.theme() === 'dark'
      "
    >
      Aucun projet consulté
    </p>

  }

</aside>
