<span
  class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold"
  [ngClass]="{
    'bg-gray-200 text-gray-700': status() === 'En attente',
    'bg-blue-100 text-blue-700': status() === 'En cours',
    'bg-green-100 text-green-700': status() === 'Terminé'
  }"
>
  {{ status() }}
</span>
